<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日本列島 立体天気 AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D sky over the archipelago; time readout top-left, city card right (above the timeline on phones), timeline pinned to the bottom */
:root{
  --ink:#060a15;
  --panel:rgba(10,16,32,.72);
  --line:rgba(160,195,235,.2);
  --fg:#eaf0f8;
  --muted:#93a2bb;
  --accent:#a8e0f2;
  --rain:#7cc7ff;
  --storm:#ff8f6b;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);overflow:hidden;margin:0;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;background:none;color:var(--fg);font-family:var(--f-body);
  display:flex;flex-direction:column;align-items:center;padding:2px 4px;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.7)}
.lbl .n{font-size:11px;font-weight:700;letter-spacing:.08em}
.lbl .t{font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.lbl .w{font-size:10px;color:#c9d4e6}
.lbl.sel .n{color:var(--accent)}
.lbl:focus-visible{outline:1px solid var(--accent);border-radius:4px}
.tlbl{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;text-shadow:0 1px 4px #000}
.tlbl.ty{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding-left:8px;border-left:1px solid var(--storm)}
.tlbl.ty b{font-size:12px;color:var(--storm);letter-spacing:.06em}
.tlbl.ty span{font-family:var(--f-mono);font-size:10px;color:#ffd6c8}
.tlbl.pt{font-family:var(--f-mono);font-size:9px;color:rgba(255,190,165,.8)}

header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;right:16px;pointer-events:none;display:flex;flex-direction:column;gap:4px;max-width:34rem}
h1{font-family:var(--f-display);font-weight:400;font-size:13px;margin:0;letter-spacing:.18em;color:var(--accent)}
.clock{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clock .date{font-family:var(--f-display);font-size:clamp(26px,4.6vw,44px);line-height:1.05;letter-spacing:.02em}
.clock .hm{font-family:var(--f-mono);font-size:clamp(22px,3.6vw,34px);font-weight:500;font-variant-numeric:tabular-nums}
.clock .tag{font-size:11px;font-weight:700;letter-spacing:.12em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);align-self:center}
.clock .tag.now{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.alert{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:4px}
.alert i{width:8px;height:8px;border-radius:50%;background:var(--storm);box-shadow:0 0 10px var(--storm);flex:none}
.alert b{font-family:var(--f-mono);font-weight:500}
.legend{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:6px}
.legend .bar{width:120px;height:5px;border-radius:3px;background:linear-gradient(90deg,#3d6bff,#36b3ff 27%,#3ee0c0 50%,#ffd25a 73%,#ff8a3d 91%,#ff4d6d)}

#card{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);width:296px;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
#card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.08em}
#card .area{font-size:11px;color:var(--muted);text-align:right}
.now{display:flex;align-items:flex-end;gap:12px}
.now .big{font-family:var(--f-mono);font-size:38px;font-weight:500;line-height:.95;font-variant-numeric:tabular-nums}
.now .desc{font-size:13px;line-height:1.5}
.now .desc small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
#spark{width:100%;height:70px;display:block}
.spark-cap{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;color:var(--muted)}

#timeline{position:fixed;left:0;right:0;bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(to top,rgba(6,10,21,.96) 55%,rgba(6,10,21,0));display:flex;align-items:center;gap:10px}
.ctl{flex:none;display:flex;gap:6px}
.ctl button{border:1px solid var(--line);background:rgba(12,18,34,.8);color:var(--fg);border-radius:10px;height:40px;min-width:40px;padding:0 10px;cursor:pointer;
  font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center}
.ctl button svg{width:15px;height:15px;fill:currentColor}
.ctl button[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.track{position:relative;flex:1;min-width:0;padding-top:4px}
#t{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:grab;display:block}
#t:active{cursor:grabbing}
#t::-webkit-slider-runnable-track{height:30px;border-radius:8px;background:var(--trackbg);border:1px solid var(--line)}
#t::-moz-range-track{height:30px;border-radius:8px;background:var(--trackbg);border:1px solid var(--line)}
#t::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:42px;margin-top:-7px;border-radius:2px;background:#fff;box-shadow:0 0 0 3px rgba(168,224,242,.35),0 0 14px rgba(168,224,242,.9)}
#t::-moz-range-thumb{width:4px;height:42px;border:0;border-radius:2px;background:#fff;box-shadow:0 0 0 3px rgba(168,224,242,.35),0 0 14px rgba(168,224,242,.9)}
#t:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.ticks{position:relative;height:16px;margin-top:4px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ticks span{position:absolute;top:0;transform:translateX(2px);white-space:nowrap}
.ticks span b{color:var(--fg);font-weight:500}
.ticks span.sat i{color:#8fb6ff}.ticks span.sun i{color:#ff9a9a}
.ticks span i{font-style:normal}
.nowmark{position:absolute;top:0;width:2px;height:34px;background:var(--accent);opacity:.7;pointer-events:none;border-radius:1px}
.src{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);font-size:10px;color:var(--muted);max-width:21rem;line-height:1.55;text-align:right;pointer-events:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:760px){
  #card{top:auto;left:16px;right:16px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);padding:10px 12px;gap:4px}
  #card h2{font-size:18px}
  .now .big{font-size:28px}
  #spark{height:46px}
  .src{display:none}
  .ctl button.txt{display:none}
  .legend{display:none}
  .ticks span .wd{display:none}
}
#ui{position:fixed;inset:0;pointer-events:none}
#card,#timeline,#arTop,#toast{pointer-events:auto}
#gest{position:absolute;inset:0;pointer-events:none;touch-action:none}
body.ar.placed #gest{pointer-events:auto}
body.ar{background:transparent}
body.ar #card,body.ar .src,body.ar .legend{display:none}
body.ar #timeline{background:linear-gradient(to top,rgba(6,10,21,.8),rgba(6,10,21,0))}
#arTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;display:flex;gap:8px}
#arTop button{border:1px solid var(--line);background:rgba(12,18,34,.85);color:var(--fg);border-radius:10px;height:38px;padding:0 12px;font-family:var(--f-body);font-size:12px;font-weight:700;cursor:pointer}
#arHint{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;text-align:center;width:max-content;max-width:calc(100% - 64px);line-height:1.6}
#arHint small{display:block;font-size:11px;color:var(--muted)}
#toast{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);margin:0 auto;max-width:26rem;background:rgba(10,16,32,.94);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:13px;line-height:1.7;display:flex;flex-direction:column;gap:10px}
#toast b{font-size:15px}
#toast button{align-self:flex-end;border:0;background:var(--accent);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:700;font-family:var(--f-body);cursor:pointer}
.ctl button.arb{border-color:var(--accent);color:var(--accent);letter-spacing:.12em}
</style>
</head>
<body>

<div id="stage"></div>
<div id="ui">
<div id="gest"></div>
<div id="labels"></div>

<header>
  <h1>日本列島 立体天気</h1>
  <div class="clock"><span class="date" id="date"></span><span class="hm" id="hm"></span><span class="tag" id="tag"></span></div>
  <div class="alert" id="alert" hidden><i></i><span id="alertText"></span></div>
  <div class="legend"><span>地面の色＝気温</span><span>10°</span><span class="bar"></span><span>32°C</span></div>
</header>

<aside id="card" aria-live="polite"></aside>

<div class="src">出典：気象庁の府県天気予報・週間天気予報・台風情報（2026年10月1〜2日発表分）。雲と雨の広がりは各地の予報から補間した表現で、実際の雲画像やレーダーではありません。ドラッグで回転、ピンチ／ホイールで拡大。ARボタンで机や床の上に表示できます（WebXR対応端末）。</div>

<div id="timeline">
  <div class="ctl">
    <button id="play" aria-label="再生" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></button>
    <button id="nowBtn" class="txt" aria-label="現在時刻に戻る">現在</button>
    <button id="arBtn" class="arb" aria-label="ARで表示">AR</button>
  </div>
  <div class="track">
    <input type="range" id="t" min="0" max="1" step="0.01" value="0" aria-label="日時">
    <div class="nowmark" id="nowmark"></div>
    <div class="ticks" id="ticks"></div>
  </div>
</div>
<div id="arTop" hidden><button id="arReset">置き直す</button><button id="arExit">AR終了</button></div>
<div id="arHint" hidden></div>
<div id="toast" hidden><b></b><span></span><button id="toastOk">閉じる</button></div>
</div>

  for(let j=0;j<F.ny;j++){const lat=F.lat0+j*(F.lat1-F.lat0)/(F.ny-1);
    for(let i=0;i<F.nx;i++){const lon=F.lon0+i*(F.lon1-F.lon0)/(F.nx-1);
      let sw=0,sc=0,sr=0;
      for(let k=0;k<CITIES.length;k++){const dx=(lon-CITIES[k].lon)*KX,dy=lat-CITIES[k].lat,w=1/Math.pow(dx*dx+dy*dy+.5,1.5);sw+=w;sc+=w*cur[k].cover;sr+=w*cur[k].rain;}
      const cov=(sc+wbC*.16)/(sw+wbC),rn=sr/(sw+wbR);
      const o=(j*F.nx+i)*4;fieldData[o]=Math.min(255,cov*255);fieldData[o+1]=Math.min(255,rn*255);fieldData[o+3]=255;}}

scene.add(world);
const BW=44*KX,BD=36,BX=X(141),BZ=Z(31);
const base=new THREE.Group();base.visible=false;world.add(base);
(function(){
  const slab=new THREE.Mesh(new THREE.BoxGeometry(BW,.6,BD),new THREE.MeshStandardMaterial({color:0x0a1a30,roughness:.5,metalness:.25}));
  slab.position.set(BX,-.31,BZ);base.add(slab);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(BW,BD),new THREE.MeshBasicMaterial({color:0x0f3a60}));
  top.rotation.x=-Math.PI/2;top.position.set(BX,-.006,BZ);base.add(top);
  const rim=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(BW,.6,BD)),new THREE.LineBasicMaterial({color:0xa8e0f2,transparent:true,opacity:.7}));
  rim.position.copy(slab.position);base.add(rim);
  const gm=new THREE.LineBasicMaterial({color:0x3f77a8,transparent:true,opacity:.45}),pts=[];
  for(let lon=120;lon<=162;lon+=2)pts.push(new THREE.Vector3(X(lon),0,Z(13)),new THREE.Vector3(X(lon),0,Z(49)));
  for(let lat=14;lat<=48;lat+=2)pts.push(new THREE.Vector3(X(119),0,Z(lat)),new THREE.Vector3(X(163),0,Z(lat)));
  base.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),gm));
})();
const reticle=new THREE.Group();reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
(function(){
  const ring=new THREE.Mesh(new THREE.RingGeometry(.07,.085,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xa8e0f2}));
  const fill=new THREE.Mesh(new THREE.PlaneGeometry(BW*.016,BD*.016).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xa8e0f2,transparent:true,opacity:.15}));
  reticle.add(ring,fill);
})();

const AR_SCALE=0.016;
let arSession=null,hitSrc=null,placed=false,WS=1,arAngle=0;const arCenter=new THREE.Vector3();
const UP=new THREE.Vector3(0,1,0);
const activeCam=()=>renderer.xr.isPresenting?renderer.xr.getCamera(camera):camera;
function setFogDen(v){[seaU,landU,cloudU,tyU].forEach(u=>u.uDen.value=v);}
function setWorldScale(s){WS=s;world.scale.setScalar(s);cloudU.uWS.value=tyU.uWS.value=s;flashLight.distance=30*s;}
function applyWorld(){
  world.rotation.set(0,arAngle,0);
  const off=new THREE.Vector3(BX,0,BZ).multiplyScalar(WS).applyAxisAngle(UP,arAngle);
  world.position.copy(arCenter).sub(off);
}
const hintEl=document.getElementById("arHint"),arTop=document.getElementById("arTop");
function hint(main,sub){if(!main){hintEl.hidden=true;return;}hintEl.hidden=false;hintEl.innerHTML=main+(sub?`<small>${sub}</small>`:"");}
function toast(title,body){const t=document.getElementById("toast");t.querySelector("b").textContent=title;t.querySelector("span").textContent=body;t.hidden=false;}
document.getElementById("toastOk").onclick=()=>document.getElementById("toast").hidden=true;
const NOXR="この端末やブラウザは WebXR の AR に対応していないか、HTTPS で開かれていません。ARCore 対応の Android 端末の Chrome で、HTTPS で公開したこのページを開いてください。iPhone の Safari は現在 WebXR の AR に対応していません。";

let xrOK=null;
if(navigator.xr&&navigator.xr.isSessionSupported){navigator.xr.isSessionSupported("immersive-ar").then(v=>xrOK=v).catch(()=>xrOK=false);}else xrOK=false;
let autoPlace=false;
function xrErr(e){
  const n=e&&e.name||"",m=String(e&&e.message||e);
  if(n==="NotAllowedError"||n==="SecurityError")return "カメラの使用が許可されていないか、ボタン操作から時間がたちすぎました。Chrome のサイト設定でカメラを許可してから、もう一度 AR ボタンを押してください。（"+n+": "+m+"）";
  if(n==="NotSupportedError")return "この端末では AR の機能が使えません。Play ストアで「Google Play Services for AR」をインストール・更新してから、もう一度お試しください。（"+n+": "+m+"）";
  return (n?n+": ":"")+m;
}
async function startAR(){
  stopPlay();
  if(xrOK===false||!navigator.xr)return toast("AR を開始できません",NOXR);
  let s=null;
  try{
    // requestSession must run right away inside the tap, before any other await
    s=await navigator.xr.requestSession("immersive-ar",{optionalFeatures:["hit-test","dom-overlay","local-floor"],domOverlay:{root:document.getElementById("ui")}});
  }catch(e){return toast("AR を開始できませんでした",xrErr(e));}
  try{
    arSession=s;s.addEventListener("end",exitAR);s.addEventListener("select",onSelect);
    await renderer.xr.setSession(s);
    enterAR();
  }catch(e){toast("AR を開始できませんでした",xrErr(e));try{s.end();}catch(_){}return;}
  try{const vs=await s.requestReferenceSpace("viewer");hitSrc=await s.requestHitTestSource({space:vs});autoPlace=false;}
  catch(e){hitSrc=null;autoPlace=true;hint("平面検出が使えないため、目の前に表示します","");}
}
function enterAR(){
  document.body.classList.add("ar");document.body.classList.remove("placed");
  skyMesh.visible=stars.visible=sea.visible=false;base.visible=true;world.visible=false;placed=false;
  setWorldScale(AR_SCALE);setFogDen(0);controls.enabled=false;controls.autoRotate=false;
  arTop.hidden=false;hint("机や床にカメラを向けて","ゆっくり動かすと平面を検出します");
}
function exitAR(){
  document.body.classList.remove("ar","placed");
  skyMesh.visible=stars.visible=sea.visible=true;base.visible=false;world.visible=true;
  world.position.set(0,0,0);world.rotation.set(0,0,0);setWorldScale(1);setFogDen(.016);
  controls.enabled=true;arTop.hidden=true;hint(null);reticle.visible=false;
  if(hitSrc){try{hitSrc.cancel();}catch(e){}}hitSrc=null;arSession=null;placed=false;autoPlace=false;
  setTimeout(()=>{resize.done=true;resize();},50);
}
function onSelect(){
  if(placed||!reticle.visible)return;
  const p=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3();reticle.matrix.decompose(p,q,sc);
  const cp=new THREE.Vector3();activeCam().getWorldPosition(cp);
  arAngle=Math.atan2(cp.x-p.x,cp.z-p.z);arCenter.copy(p);applyWorld();
  world.visible=true;placed=true;reticle.visible=false;document.body.classList.add("placed");
  hint("1本指で回転・2本指で拡大縮小","下のスライダーで日時を動かせます");setTimeout(()=>{if(placed)hint(null);},3500);
}
function arFrame(xrFrame){
  if(!renderer.xr.isPresenting||!xrFrame)return;
  const cam=renderer.xr.getCamera(camera),bl=arSession&&arSession.renderState.baseLayer;
  const sc=cam.projectionMatrix.elements[5]*(bl?bl.framebufferHeight:innerHeight*devicePixelRatio)/2;cloudU.uScale.value=tyU.uScale.value=sc;
  if(placed)return;
  if(autoPlace){ // no hit-test: put the map 0.9m ahead, 0.45m below the eyes
    const cp=new THREE.Vector3(),fw=new THREE.Vector3();cam.getWorldPosition(cp);cam.getWorldDirection(fw);fw.y=0;
    if(fw.lengthSq()<1e-4)return;fw.normalize();
    arCenter.copy(cp).addScaledVector(fw,.9);arCenter.y-=.45;arAngle=Math.atan2(-fw.x,-fw.z);applyWorld();
    world.visible=true;placed=true;document.body.classList.add("placed");setTimeout(()=>hint("1本指で回転・2本指で拡大縮小","下のスライダーで日時を動かせます"),1500);setTimeout(()=>{if(placed)hint(null);},5000);return;}
  if(!hitSrc)return;
  const r=xrFrame.getHitTestResults(hitSrc);
  if(r.length){const pose=r[0].getPose(renderer.xr.getReferenceSpace());reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix);hint("画面をタップしてここに配置","枠の大きさは約70cmです");}
  else{reticle.visible=false;}
}
document.getElementById("arBtn").onclick=startAR;
document.getElementById("arExit").onclick=()=>arSession&&arSession.end();
document.getElementById("arReset").onclick=()=>{placed=false;if(!hitSrc)autoPlace=true;world.visible=false;document.body.classList.remove("placed");hint("机や床にカメラを向けて","平面が見つかったらタップで配置");};
// keep taps on the overlay controls from placing the map
["timeline","arTop","toast","gest","card"].forEach(id=>document.getElementById(id).addEventListener("beforexrselect",e=>e.preventDefault()));
// AR gestures: one finger rotates, two fingers scale
(function(){
  const g=document.getElementById("gest");let st=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  g.addEventListener("touchstart",e=>{const t=e.touches;st=t.length>=2?{d:dist(t),s:WS}:{x:t[0].clientX,a:arAngle};},{passive:true});
  g.addEventListener("touchmove",e=>{if(!st||!placed)return;const t=e.touches;
    if(t.length>=2){if(st.d==null)st={d:dist(t),s:WS};setWorldScale(Math.min(.06,Math.max(.005,st.s*dist(t)/st.d)));}
    else if(st.x!=null){arAngle=st.a+(t[0].clientX-st.x)*.008;}
    applyWorld();},{passive:true});
  g.addEventListener("touchend",e=>{if(e.touches.length===0)st=null;else if(e.touches.length===1)st={x:e.touches[0].clientX,a:arAngle};},{passive:true});
})();

/* ================= UI ================= */
const slider=document.getElementById("t");
const nowT=()=>(Date.now()-T0)/3600e3;
const NOW=Math.min(TMAX,Math.max(TMIN,nowT()));
slider.min=TMIN;slider.max=TMAX;slider.value=NOW;
let T=NOW,dirty=true;
// track background: night shading + day separators
(function(){
  const stops=[],pct=t=>((t-TMIN)/(TMAX-TMIN)*100).toFixed(2)+"%";
  const night="rgba(20,30,60,.95)",day="rgba(70,110,160,.55)";
  for(let d=0;d<7;d++){
    const a=d*24,ss=[[a,night],[a+5.5,night],[a+7,day],[a+17,day],[a+18.5,night],[a+24,night]];
    ss.forEach(([t,c])=>{if(t>=TMIN&&t<=TMAX)stops.push(`${c} ${pct(t)}`);});
  }
  const seps=[];for(let d=1;d<7;d++){const p=pct(d*24);seps.push(`linear-gradient(90deg,transparent calc(${p} - 1px),rgba(200,220,255,.45) calc(${p} - 1px),rgba(200,220,255,.45) ${p},transparent ${p})`);}
  slider.style.setProperty("--trackbg",`${seps.join(",")},linear-gradient(90deg,${night},${stops.join(",")})`);
  const tk=document.getElementById("ticks");
  for(let d=0;d<7;d++){const t=Math.max(TMIN,d*24),f=fmt(d*24),cls=WD[d]==="土"?"sat":WD[d]==="日"?"sun":"";
    const s=document.createElement("span");s.className=cls;s.style.left=pct(t);s.innerHTML=`<b>${f.m}/${f.d}</b><i class="wd"> ${WD[d]}</i>`;tk.appendChild(s);}
  document.getElementById("nowmark").style.left=`calc(${pct(NOW)} - 1px)`;
})();

function setT(v){T=+v;slider.value=T;dirty=true;}
slider.addEventListener("input",()=>{stopPlay();T=+slider.value;dirty=true;});
document.getElementById("nowBtn").onclick=()=>{stopPlay();setT(NOW);};
let playing=false;const playBtn=document.getElementById("play");
function stopPlay(){playing=false;playBtn.setAttribute("aria-pressed","false");playBtn.innerHTML='<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>';playBtn.setAttribute("aria-label","再生");}
playBtn.onclick=()=>{if(playing)return stopPlay();playing=true;if(T>=TMAX-.5)setT(TMIN);playBtn.setAttribute("aria-pressed","true");
  playBtn.innerHTML='<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';playBtn.setAttribute("aria-label","一時停止");};

function codeText(c,t){const d=dayOf(t),code=pick(c.c,d);return (WX[code]||[])[4]||"—";}
function renderHeader(){
  const f=fmt(T),isNow=Math.abs(T-NOW)<.34;
  document.getElementById("date").textContent=`${f.m}月${f.d}日(${f.wd})`;
  document.getElementById("hm").textContent=`${f.h}:${String(f.mi).padStart(2,"0")}`;
  const tag=document.getElementById("tag");tag.textContent=isNow?"現在":T<NOW?"":"予報";tag.className="tag"+(isNow?" now":"");tag.hidden=!isNow&&T<NOW;
  const ty=typhoonAt(T),al=document.getElementById("alert");
  if(ty&&ty.fade>.3){al.hidden=false;document.getElementById("alertText").innerHTML=`台風第${TY.no}号（${TY.name}） 中心気圧 <b>${ty.hpa}hPa</b> 最大風速 <b>${ty.ms}m/s</b>`;}else al.hidden=true;
}
function renderCard(force){
  const c=CITIES[sel],s=cityAt(c,T),d=dayOf(T);
  CITIES.forEach((x,j)=>x.o.lbl.classList.toggle("sel",j===sel));
  const card=document.getElementById("card");
  if(force||!card.dataset.city||card.dataset.city!=sel){
    card.dataset.city=sel;
    card.innerHTML=`<div class="top"><h2>${c.n}</h2><span class="area">${c.a}</span></div>
      <div class="now"><div class="big" id="cTemp"></div><div class="desc" id="cDesc"></div></div>
      <svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none" aria-label="${c.n}の気温と雨の推移"></svg>
      <div class="spark-cap"><span>気温（線）・雨の強さ（棒）</span><span>${fmt(TMIN).m}/${fmt(TMIN).d}–${fmt(TMAX).m}/${fmt(TMAX).d}</span></div>`;
    drawSpark(c);
  }
  const tEl=document.getElementById("cTemp");tEl.textContent=`${Math.round(s.temp)}°`;tEl.style.color=tcss(s.temp);
  const pop=pick(c.p,d),lo=pick(c.lo,d),hi=pick(c.hi,d);
  document.getElementById("cDesc").innerHTML=`${codeText(c,T)}<small>最高 ${hi}° / 最低 ${lo}° ・ 降水確率 ${pop??"–"}%</small>`;
  const cx=(T-TMIN)/(TMAX-TMIN)*300,cur=document.getElementById("sparkCur");if(cur){cur.setAttribute("x1",cx);cur.setAttribute("x2",cx);}
}
function drawSpark(c){
  const W=300,H=70,xs=t=>(t-TMIN)/(TMAX-TMIN)*W;let lo=99,hi=-99;const pts=[];
  for(let t=TMIN;t<=TMAX;t+=1){const v=cityAt(c,t).temp;lo=Math.min(lo,v);hi=Math.max(hi,v);pts.push([t,v]);}
  lo-=1;hi+=1;const ys=v=>8+(1-(v-lo)/(hi-lo))*(H-26);
  let bars="";for(let t=TMIN;t<=TMAX;t+=2){const r=cityAt(c,t).rain;if(r>.02)bars+=`<rect x="${xs(t).toFixed(1)}" y="${(H-2-r*30).toFixed(1)}" width="2.6" height="${(r*30).toFixed(1)}" fill="#7cc7ff" opacity=".8"/>`;}
  let seps="";for(let d=1;d<7;d++)seps+=`<line x1="${xs(d*24)}" x2="${xs(d*24)}" y1="0" y2="${H}" stroke="rgba(200,220,255,.15)"/>`;
  const grad=`<defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${tcss(hi)}"/><stop offset="1" stop-color="${tcss(lo)}"/></linearGradient></defs>`;
  const path=pts.map(([t,v],i)=>`${i?"L":"M"}${xs(t).toFixed(1)},${ys(v).toFixed(1)}`).join("");
  document.getElementById("spark").innerHTML=`${grad}${seps}${bars}<path d="${path}" fill="none" stroke="url(#tg)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <text x="2" y="${ys(hi-1)-2}" fill="#93a2bb" font-size="9" font-family="IBM Plex Mono">${Math.round(hi-1)}°</text>
    <line id="sparkCur" x1="0" x2="0" y1="0" y2="${H}" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
}

/* ================= picking ================= */
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener("pointerdown",e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener("pointerup",e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)return;
  const r=renderer.domElement.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);
  const hit=ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-LAND),new THREE.Vector3());if(!hit)return;
  let best=-1,bd=1.2;CITIES.forEach((c,i)=>{const d=Math.hypot(hit.x-X(c.lon),hit.z-Z(c.lat));if(d<bd){bd=d;best=i;}});if(best>=0){sel=best;renderCard(true);}});

/* ================= sizing ================= */
function resize(){
  if(renderer.xr.isPresenting)return;
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  const s=renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360));cloudU.uScale.value=s;tyU.uScale.value=s;
  if(!resize.done){const portrait=w<h,dist=portrait?44:30;camera.position.set(3,dist*.78,dist*.72);controls.target.set(portrait?1.5:2.5,0,portrait?-1:-1.5);controls.update();resize.done=true;}
}
addEventListener("resize",resize);resize();

/* ================= sky / light by hour ================= */
const C=h=>new THREE.Color(h);
const SKY={nTop:C(0x03060e),nHor:C(0x0a1530),dTop:C(0x2d66a8),dHor:C(0x9ec6e4),tw:C(0xf29a6a)};
function lightFor(t){
  const h=((t%24)+24)%24,a=(h-6)/12*Math.PI,elev=Math.sin(a);
  const day=THREE.MathUtils.smoothstep(elev,-.12,.3),tw=Math.exp(-Math.pow(elev/.16,2));
  skyU.uTop.value.copy(SKY.nTop).lerp(SKY.dTop,day);
  skyU.uHor.value.copy(SKY.nHor).lerp(SKY.dHor,day).lerp(SKY.tw,tw*.55);
  skyU.uGlow.value.copy(SKY.tw).multiplyScalar(tw*.7);
  const dir=new THREE.Vector3(Math.cos(a),Math.max(elev,.15),.45).normalize();skyU.uSun.value.copy(dir);
  sun.position.copy(dir).multiplyScalar(40);sun.intensity=.15+day*.95;sun.color.copy(C(0xffffff)).lerp(C(0xffb07a),tw*.7);
  hemi.intensity=.25+day*.55;starMat.opacity=(1-day)*.85;
  fog.color.copy(skyU.uHor.value);
  landU.uDay.value=day;landU.uSun.value.copy(dir);seaU.uDay.value=day;
  const lit=C(0x5a6a8c).lerp(C(0xffffff),day).lerp(C(0xffc9a6),tw*.6),shade=C(0x141c2e).lerp(C(0x8392ab),day);
  cloudU.uLit.value.copy(lit);cloudU.uShade.value.copy(shade);tyU.uLit.value.copy(lit);tyU.uShade.value.copy(shade);
  jpEdge.opacity=.85-day*.35;
  return day;
}

/* ================= loop ================= */
const v3=new THREE.Vector3(),clock=new THREE.Clock();let flash=0,nextFlash=2,dayAmt=0,RT=0;
function place(el,pos,dy){if(!world.visible){el.style.display="none";return false;}v3.copy(pos).project(activeCam());const vis=v3.z<1&&v3.z>-1&&Math.abs(v3.x)<1.2&&Math.abs(v3.y)<1.2;el.style.display=vis?"":"none";
  if(vis){el.style.transform=`translate(${((v3.x*.5+.5)*innerWidth).toFixed(1)}px,${((-v3.y*.5+.5)*innerHeight+(dy||0)).toFixed(1)}px) translate(-50%,-100%)`;el.style.zIndex=Math.round((1-v3.z)*1e5);}return vis;}
function frame(time,xrFrame){
  arFrame(xrFrame);
  const dt=Math.min(clock.getDelta(),.05);RT+=dt;const rt=RT;
  if(playing){setT(Math.min(TMAX,T+.14));if(T>=TMAX)stopPlay();}
  if(dirty){updateField(T);dayAmt=lightFor(T);renderHeader();renderCard(false);
    CITIES.forEach((c,i)=>{const s=cur[i],o=c.o,col=tcol(s.temp);o.beam.material.color.copy(col);o.dot.material.color.copy(col);o.beam.scale.y=.4+s.temp*.035;
      o.lbl.querySelector(".t").textContent=`${Math.round(s.temp)}°`;o.lbl.querySelector(".t").style.color=tcss(s.temp);o.lbl.querySelector(".w").textContent=codeText(c,T);});
    // typhoon
    const ty=typhoonAt(T);tyGroup.visible=!!ty;
    if(ty){tyU.uC.value.set(X(ty.lon),0,Z(ty.lat));tyU.uR.value=2.4+(1000-ty.hpa)/65*2.6;tyU.uA.value=ty.fade;flashLight.position.set(X(ty.lon),2,Z(ty.lat));
      tyLbl.innerHTML=`<b>台風第${TY.no}号</b><span>${ty.hpa}hPa ${ty.ms}m/s</span>`;}
    const past=[...TY.pts.filter(p=>p.t<=T).map(p=>new THREE.Vector3(X(p.lon),.07,Z(p.lat)))];if(ty)past.push(new THREE.Vector3(X(ty.lon),.07,Z(ty.lat)));
    trackPast.geometry.setFromPoints(past.length>1?past:[new THREE.Vector3(),new THREE.Vector3()]);
    dirty=false;}
  const drift=T*.32+(REDUCED?0:rt*.03);cloudU.uDrift.value=drift;rainU.uDrift.value=drift;
  rainU.uTime.value=rt;tyU.uTime.value=(REDUCED?0:rt*.6)+T*.8;seaU.uTime.value=rt;
  // lightning inside the typhoon and heavy rain clouds
  if(!REDUCED&&tyGroup.visible){nextFlash-=dt;if(nextFlash<=0){flash=1;nextFlash=1.5+Math.random()*4;}}
  flash*=.86;const fl=flash>.05?flash*(Math.random()>.4?1:.3):0;tyU.uFlash.value=fl*.9;cloudU.uFlash.value=fl*.5;flashLight.intensity=fl*4;
  // labels
  CITIES.forEach(c=>{v3.set(0,0,0);place(c.o.lbl,world.localToWorld(c.o.g.position.clone().setY(LAND+c.o.beam.scale.y+.15)));});
  if(tyGroup.visible){const p=tyU.uC.value.clone();p.y=3.6;p.x+=tyU.uR.value*.15;place(tyLbl,world.localToWorld(p));}else tyLbl.style.display="none";
  trackPts.forEach((p,i)=>{if(TY.pts[i].t<T-2){ptLbls[i].style.display="none";return;}place(ptLbls[i],world.localToWorld(p.clone().setY(.1)),14);});
  if(!renderer.xr.isPresenting)controls.update();renderer.render(scene,camera);
}
renderCard(true);renderer.setAnimationLoop(frame);
</script>
